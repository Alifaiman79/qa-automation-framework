name: Playwright CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      test_grep:
        description: Playwright grep filter for tests/demo/
        required: false
        default: '@smoke'
        type: string

permissions:
  contents: read

jobs:
  chromium-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      BASE_URL: https://demo.playwright.dev/todomvc/
      TEST_GREP: ${{ inputs.test_grep || '@smoke' }}
      TEST_ENV: demo
      EVIDENCE_PROJECT: portfolio-demo
      EVIDENCE_RETENTION_ENABLED: 'true'

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate TypeScript
        run: npx tsc --noEmit

      - name: Validate BASE_URL
        shell: bash
        run: |
          if [ -z "${BASE_URL:-}" ]; then
            echo "::error::BASE_URL must be set for CI."
            exit 1
          fi

      - name: Install Chromium and Linux dependencies
        run: npx playwright install --with-deps chromium

      - name: Run public Chromium smoke tests
        run: npx playwright test tests/demo/ --project=chromium --workers=1 --grep "$TEST_GREP"

      - name: Upload Playwright HTML report
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: playwright-report-${{ github.run_id }}-${{ github.run_attempt }}
          path: playwright-report/
          if-no-files-found: ignore
          retention-days: 7

      - name: Upload Playwright test results
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: test-results-${{ github.run_id }}-${{ github.run_attempt }}
          path: test-results/
          if-no-files-found: ignore
          retention-days: 7

      - name: Upload execution evidence
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: test-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: test-evidence/
          if-no-files-found: ignore
          retention-days: 7

  api-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      API_BASE_URL: https://dummyjson.com
      TEST_ENV: demo
      EVIDENCE_PROJECT: portfolio-demo
      EVIDENCE_RETENTION_ENABLED: 'true'

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate TypeScript
        run: npx tsc --noEmit

      - name: Validate API_BASE_URL
        shell: bash
        run: |
          if [ -z "${API_BASE_URL:-}" ]; then
            echo "::error::API_BASE_URL must be set for API CI."
            exit 1
          fi

      - name: Run public API tests
        run: npx playwright test tests/api/ --project=api --grep @api --workers=1 --retries=0

      - name: Upload API HTML report
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: api-playwright-report-${{ github.run_id }}-${{ github.run_attempt }}
          path: playwright-report/
          if-no-files-found: ignore
          retention-days: 7

      - name: Upload API test results
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: api-test-results-${{ github.run_id }}-${{ github.run_attempt }}
          path: test-results/
          if-no-files-found: ignore
          retention-days: 7

      - name: Upload API execution evidence
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: api-test-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: test-evidence/
          if-no-files-found: ignore
          retention-days: 7

  integration-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      INTEGRATION_PORT: '4179'
      TEST_ENV: local-integration
      EVIDENCE_PROJECT: portfolio-demo
      EVIDENCE_RETENTION_ENABLED: 'true'

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate TypeScript
        run: npx tsc --noEmit

      - name: Install Chromium and Linux dependencies
        run: npx playwright install --with-deps chromium

      - name: Run local API and UI integration test
        run: npx playwright test -c playwright.integration.config.ts --project=chromium --workers=1 --retries=0

      - name: Upload integration HTML report
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: integration-playwright-report-${{ github.run_id }}-${{ github.run_attempt }}
          path: playwright-report/
          if-no-files-found: ignore
          retention-days: 7

      - name: Upload integration test results
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: integration-test-results-${{ github.run_id }}-${{ github.run_attempt }}
          path: test-results/
          if-no-files-found: ignore
          retention-days: 7

      - name: Upload integration execution evidence
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: integration-test-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: test-evidence/
          if-no-files-found: ignore
          retention-days: 7

  authentication-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      AUTH_PORT: '4180'
      EVIDENCE_PROJECT: portfolio-demo
      EVIDENCE_RETENTION_ENABLED: 'false'

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate TypeScript
        run: npx tsc --noEmit

      - name: Install Chromium and Linux dependencies
        run: npx playwright install --with-deps chromium

      - name: Run local authentication and RBAC tests
        shell: bash
        run: |
          set +x
          admin_password="$(node -e "process.stdout.write(require('node:crypto').randomBytes(32).toString('hex'))")"
          standard_password="$(node -e "process.stdout.write(require('node:crypto').randomBytes(32).toString('hex'))")"
          while [[ "$standard_password" == "$admin_password" ]]; do
            standard_password="$(node -e "process.stdout.write(require('node:crypto').randomBytes(32).toString('hex'))")"
          done
          printf '::add-mask::%s\n' "$admin_password"
          printf '::add-mask::%s\n' "$standard_password"
          export AUTH_ADMIN_PASSWORD="$admin_password"
          export AUTH_STANDARD_PASSWORD="$standard_password"
          unset admin_password standard_password

          auth_log="$(mktemp)"
          trap 'rm -f "$auth_log"; unset AUTH_ADMIN_PASSWORD AUTH_STANDARD_PASSWORD' EXIT
          set +e
          npx playwright test -c playwright.auth.config.ts --project=chromium --workers=1 --retries=0 >"$auth_log" 2>&1
          playwright_status=$?
          summary="$(awk '
            /^[[:space:]]*[0-9]+ (passed|failed|skipped)([[:space:]]|$)/ {
              if ($2 == "passed") passed = $1
              if ($2 == "failed") failed = $1
              if ($2 == "skipped") skipped = $1
              seen = 1
            }
            END {
              if (seen) printf "%d passed, %d failed, %d skipped", passed + 0, failed + 0, skipped + 0
              else printf "counts unavailable"
            }
          ' "$auth_log")"
          summary="${summary:-counts unavailable}"
          printf 'Authentication suite: %s; Playwright exit code: %d\n' "$summary" "$playwright_status"
          if [[ "$playwright_status" -ne 0 ]]; then
            printf '::error::Authentication suite failed; raw failure output withheld for privacy.\n'
          fi
          exit "$playwright_status"
